<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Tá na Rua! — Sem conexão</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
      main {
        width: min(100%, 560px);
        border: 1px solid #dbeafe;
        border-radius: 28px;
        background: white;
        padding: 40px;
        text-align: center;
        box-shadow: 0 24px 60px rgb(15 23 42 / 10%);
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 24px 0 12px;
        font-size: 32px;
      }
      p {
        color: #475569;
        line-height: 1.7;
      }
      button {
        margin-top: 20px;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #1d4ed8;
        color: white;
        padding: 0 22px;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/app-icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>
        Quando a internet voltar, recarregue a página para consultar os dados mais recentes da
        cidade.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
